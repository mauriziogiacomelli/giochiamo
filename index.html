<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Giochiamo!</title>
<meta name="theme-color" content="#22bb77">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  html, body {
    margin: 0; height: 100%; background: #111; overflow: hidden;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: absolute; left: 50%; top: 50%; width: 1024px; height: 768px;
    transform-origin: 50% 50%; overflow: hidden;
    font-family: "Arial Black", "Arial Rounded MT Bold", Impact, sans-serif;
    image-rendering: pixelated;
  }
  /* scanline leggere per l'effetto monitor anni '90 */
  #stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 999;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 1px, transparent 1px 3px);
  }
  .screen { position: absolute; inset: 0; }
  canvas, img.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .abs { position: absolute; }
  .title {
    color: #ff2a1a; font-size: 40px; letter-spacing: 1px; white-space: nowrap;
    text-shadow: 3px 3px 0 #5a1000, 4px 4px 0 #000;
  }
  .title.yellow { color: #ffe81a; text-shadow: 3px 3px 0 #a04000, 4px 4px 0 #000; }
  .tile {
    position: absolute; box-sizing: border-box; border: 10px solid; background: #222;
    box-shadow: inset 0 0 0 6px #222, 6px 6px 0 rgba(0,0,0,.35); cursor: pointer;
  }
  .tile:active, .btn:active, .sw:active { transform: translate(3px,3px); }
  .btn {
    position: absolute; box-sizing: border-box; background: #e8180c; color: #ffe81a;
    border: 4px solid #600; font-size: 30px; display: flex; align-items: center; justify-content: center;
    gap: 8px; text-shadow: 2px 2px 0 #600; box-shadow: 4px 4px 0 rgba(0,0,0,.4); cursor: pointer;
  }
  .btn.blue { background: #1a5cff; border-color: #002080; text-shadow: 2px 2px 0 #002080; }
  .btn.green { background: #1aaa33; border-color: #064010; text-shadow: 2px 2px 0 #064010; }
  .btn.on { outline: 5px solid #fff; }
  .sw { position: absolute; box-sizing: border-box; border: 3px solid #000; cursor: pointer; }
  .sw.sel { outline: 5px solid #fff; box-shadow: 0 0 0 9px #000; z-index: 2; }
  /* memory */
  .card { position: absolute; perspective: 800px; cursor: pointer; }
  .card .in { position: absolute; inset: 0; transition: transform .25s steps(4); transform-style: preserve-3d; }
  .card.open .in { transform: rotateY(180deg); }
  .card .face, .card .back { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-sizing: border-box; }
  .card .back {
    border: 8px solid #1a4cff; outline: 2px solid #fff; outline-offset: -12px;
    background: repeating-linear-gradient(45deg, #fff 0 10px, #ffcc22 10px 20px);
    display: flex; align-items: center; justify-content: center;
    font-size: 70px; color: #1a4cff; text-shadow: 3px 3px 0 #fff, 5px 5px 0 #002080;
  }
  .card .face { transform: rotateY(180deg); border: 4px solid #fff; display: flex; align-items: center; justify-content: center; }
  .card.done .face { animation: pop .4s steps(3); }
  @keyframes pop { 50% { transform: rotateY(180deg) scale(1.12); } }
  /* festa */
  #party { position: absolute; inset: 0; z-index: 500; background: rgba(0,0,40,.55); }
  #party .big { position: absolute; left: 0; right: 0; top: 200px; text-align: center; font-size: 96px; animation: bounce .6s steps(3) infinite alternate; }
  @keyframes bounce { to { transform: translateY(-20px); } }
  .fall { position: absolute; top: -60px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(900px) rotate(360deg); } }
  #rotate { display: none; }
  /* ---- stile moderno (gioco dei vestiti) ---- */
  #stage.modern { image-rendering: auto; font-family: "Segoe UI Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif; }
  #stage.modern::after { display: none; }
  .m-panel { position: absolute; background: rgba(255,255,255,.92); border-radius: 32px; box-shadow: 0 18px 40px rgba(110,50,160,.22); }
  .m-btn { position: absolute; box-sizing: border-box; border-radius: 999px; background: #fff; color: #7b2cbf; font-weight: 800;
    box-shadow: 0 6px 16px rgba(120,60,160,.25); display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 24px; cursor: pointer; transition: transform .12s; }
  .m-btn:active, .m-tab:active, .m-thumb:active, .m-sw:active { transform: scale(.92); }
  .m-btn.primary { background: linear-gradient(135deg,#9d4edd,#7b2cbf); color: #fff; }
  .m-tab { position: absolute; width: 56px; height: 56px; border-radius: 18px; background: #f3e8ff; font-size: 30px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .12s, background .2s; }
  .m-tab.on { background: linear-gradient(135deg,#c77dff,#7b2cbf); box-shadow: 0 6px 14px rgba(123,44,191,.35); }
  .m-thumb { position: absolute; border-radius: 22px; background: #faf5ff; box-shadow: inset 0 0 0 3px #eadcff; cursor: pointer; overflow: hidden; transition: transform .12s; }
  .m-thumb.on { background: #fff; box-shadow: inset 0 0 0 4px #9d4edd, 0 8px 18px rgba(123,44,191,.28); }
  .m-thumb svg { width: 100%; height: 100%; }
  .m-sw { position: absolute; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; transition: transform .12s;
    box-shadow: 0 3px 8px rgba(0,0,0,.18), inset 0 0 0 3px rgba(255,255,255,.75); }
  .m-sw.on { outline: 4px solid #7b2cbf; outline-offset: 3px; }
  .m-label { position: absolute; color: #5a189a; font-weight: 800; font-size: 26px; }
  @keyframes mpop { 50% { transform: scale(1.035); } }
  .mpop { animation: mpop .28s ease; }
  @keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.6) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(20deg); } }
  .twinkle { position: absolute; pointer-events: none; animation: twinkle 2.4s ease-in-out infinite; }
  .sk-hit { transform-box: fill-box; transform-origin: center; animation: skpop .45s ease; }
  .sk-miss { animation: skfade .7s ease forwards; }
  @keyframes skpop { from { transform: scale(.2); opacity: 0; } 70% { transform: scale(1.15); } }
  @keyframes skfade { to { opacity: 0; } }
</style>
</head>
<body>
<div id="stage"></div>
<script src="game.js?v=29"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>

</body>
</html>
